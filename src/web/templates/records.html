<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豆苗プランター - 成長記録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/common.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/records.css') }}" rel="stylesheet">
</head>
<body>
    {% include 'navbar.html' %}

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">
                    <i class="fas fa-chart-line"></i> 成長記録
                </h1>
            </div>
        </div>

        <!-- カレンダー選択エリア -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-calendar-alt"></i> カレンダー選択
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="calendar-container">
                            <div class="calendar-header">
                                <button class="btn btn-outline-primary" id="prevMonth">
                                    <i class="fas fa-chevron-left"></i>
                                </button>
                                <h4 class="calendar-title" id="calendarTitle">2024年10月</h4>
                                <button class="btn btn-outline-primary" id="nextMonth">
                                    <i class="fas fa-chevron-right"></i>
                                </button>
                            </div>
                            <div class="calendar-grid" id="calendarGrid">
                                <!-- カレンダーがJavaScriptで生成される -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 選択日付の詳細表示エリア -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-calendar-day"></i> <span id="selectedDate">日付を選択してください</span>
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="dateDetails">
                            <div class="text-center text-muted py-5">
                                <i class="fas fa-calendar-plus fa-3x mb-3"></i>
                                <p>カレンダーから日付を選択すると、その日の記録が表示されます。</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 詳細表示テンプレート（非表示） -->
    <template id="dateDetailTemplate">
        <div class="row">
            <!-- 気温データ -->
            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header">
                        <h6 class="mb-0">
                            <i class="fas fa-thermometer-half"></i> 気温データ
                        </h6>
                    </div>
                    <div class="card-body">
                        <div class="temperature-summary mb-3">
                            <div class="row text-center">
                                <div class="col-4">
                                    <div class="temp-item">
                                        <i class="fas fa-arrow-up text-danger"></i>
                                        <div class="temp-value" id="maxTemp">25°C</div>
                                        <div class="temp-label">最高</div>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="temp-item">
                                        <i class="fas fa-arrow-down text-primary"></i>
                                        <div class="temp-value" id="minTemp">18°C</div>
                                        <div class="temp-label">最低</div>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="temp-item">
                                        <i class="fas fa-chart-line text-success"></i>
                                        <div class="temp-value" id="avgTemp">21.5°C</div>
                                        <div class="temp-label">平均</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="temperature-chart">
                            <canvas id="temperatureChart" width="400" height="200"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 撮影写真 -->
            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header">
                        <h6 class="mb-0">
                            <i class="fas fa-camera"></i> 撮影写真
                        </h6>
                    </div>
                    <div class="card-body">
                        <div class="photo-gallery">
                            <div class="row">
                                <div class="col-4 mb-3">
                                    <div class="photo-item">
                                        <img src="/static/images/placeholder.jpg" class="img-fluid rounded" alt="朝の写真">
                                        <div class="photo-time">08:00</div>
                                    </div>
                                </div>
                                <div class="col-4 mb-3">
                                    <div class="photo-item">
                                        <img src="/static/images/placeholder.jpg" class="img-fluid rounded" alt="昼の写真">
                                        <div class="photo-time">12:00</div>
                                    </div>
                                </div>
                                <div class="col-4 mb-3">
                                    <div class="photo-item">
                                        <img src="/static/images/placeholder.jpg" class="img-fluid rounded" alt="夕の写真">
                                        <div class="photo-time">18:00</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 給水記録 -->
            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header">
                        <h6 class="mb-0">
                            <i class="fas fa-tint"></i> 給水記録
                        </h6>
                    </div>
                    <div class="card-body">
                        <div class="watering-record">
                            <div class="watering-times mb-3">
                                <h6>給水時間</h6>
                                <div class="time-badges">
                                    <span class="badge bg-primary me-2">09:00</span>
                                    <span class="badge bg-primary me-2">15:00</span>
                                    <span class="badge bg-primary me-2">20:00</span>
                                </div>
                            </div>
                            <div class="watering-amount">
                                <h6>給水量</h6>
                                <div class="amount-info">
                                    <i class="fas fa-tint text-primary"></i>
                                    <span class="ms-2">200ml × 3回 = <strong>600ml</strong></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 成長メモ -->
            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header">
                        <h6 class="mb-0">
                            <i class="fas fa-sticky-note"></i> 成長メモ
                        </h6>
                    </div>
                    <div class="card-body">
                        <div class="growth-notes">
                            <div class="note-item mb-3">
                                <div class="note-time">09:30</div>
                                <div class="note-content">新芽が2cm伸びました。</div>
                            </div>
                            <div class="note-item mb-3">
                                <div class="note-time">15:45</div>
                                <div class="note-content">葉の色が濃くなってきました。</div>
                            </div>
                            <div class="note-item">
                                <div class="note-time">20:15</div>
                                <div class="note-content">全体的に元気な状態です。</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/records.js') }}"></script>
</body>
</html>
